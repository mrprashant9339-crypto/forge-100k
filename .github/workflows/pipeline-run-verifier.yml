name: Pipeline run verifier

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA whose pipeline runs should be checked
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pipeline-verifier-${{ github.event.pull_request.head.sha || inputs.target_sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Independently verify all quality and security pipelines
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Find and monitor all required workflows
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.target_sha || github.sha }}
        with:
          script: |
            const sha = process.env.TARGET_SHA;
            const required = [
              { id: 418069273, name: 'Pipeline quality checks' },
              { id: 426488834, name: 'Local backend security tests' },
              { id: 426489145, name: 'CodeQL security analysis' }
            ];
            const deadline = Date.now() + 30 * 60 * 1000;
            const results = new Map();
            while (Date.now() < deadline && results.size < required.length) {
              for (const workflow of required) {
                if (results.has(workflow.id)) continue;
                const response = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.id,
                  head_sha: sha,
                  per_page: 20
                });
                const run = response.data.workflow_runs
                  .filter(item => item.event !== 'workflow_run')
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
                if (run?.status === 'completed') {
                  results.set(workflow.id, run);
                  core.info(`${workflow.name}: ${run.conclusion} (run ${run.id})`);
                } else {
                  core.info(run
                    ? `${workflow.name}: ${run.status}; waiting.`
                    : `${workflow.name}: no run found for ${sha}; waiting.`);
                }
              }
              if (results.size < required.length) {
                await new Promise(resolve => setTimeout(resolve, 30000));
              }
            }
            const missing = required.filter(item => !results.has(item.id));
            const failed = required.filter(item => results.has(item.id) && results.get(item.id).conclusion !== 'success');
            if (missing.length || failed.length) {
              core.setFailed([
                missing.length ? `Missing or timed-out workflows: ${missing.map(x => x.name).join(', ')}` : '',
                failed.length ? `Failed workflows: ${failed.map(x => x.name + ' (' + results.get(x.id).conclusion + ')').join(', ')}` : ''
              ].filter(Boolean).join('; '));
            } else {
              core.info(`All ${required.length} required workflows passed for ${sha}.`);
            }
