name: Pipeline quality checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: forge-pipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate JSON manifests and schema
        run: |
          python -m pip install jsonschema==4.25.1
          python -m json.tool pipeline/manifests/sample-batch.json >/dev/null
          python -m json.tool pipeline/schemas/asset-job.schema.json >/dev/null
          python -m json.tool pipeline/schemas/batch-manifest.schema.json >/dev/null
          python -m json.tool pipeline/schemas/pbr-material.schema.json >/dev/null
          python -m json.tool pipeline/schemas/production-asset.schema.json >/dev/null
          python -m json.tool pipeline/manifests/phase2-integration-job.json >/dev/null
          python -m py_compile pipeline/blender/generate_pbr_textures.py
          python pipeline/scripts/validate_manifest.py pipeline/manifests/sample-batch.json
      - name: Verify deterministic 100K character catalogue and queue batching
        run: |
          python -m py_compile pipeline/scripts/build_character_catalog.py
          python pipeline/tests/test_character_catalog.py
      - name: Test authentication and user-data security contracts
        run: |
          python pipeline/tests/test_auth_contract.py
      - name: Test Supabase generation worker contracts
        run: |
          python -m py_compile workers/generation_worker.py
          python workers/tests/test_generation_worker.py
      - name: Compile Python workers
        run: |
          python -m compileall -q pipeline
          python -m py_compile pipeline/blender/fit_garment.py pipeline/blender/qa_garment_fit.py pipeline/blender/merge_meshes.py
      - name: Run GLB validator tests
        run: |
          python pipeline/tests/test_glb_validator.py
          python pipeline/tests/test_morphology.py
          python pipeline/tests/test_engine_budget.py
          python pipeline/tests/test_pbr_materials.py
          python pipeline/tests/test_production_package.py
          python pipeline/tests/test_phase3_reports.py
          python -m py_compile pipeline/blender/facial_morph_pack.py pipeline/blender/facial_animation_clips.py pipeline/blender/bake_pbr_textures.py pipeline/blender/prepare_cloth_scene.py
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run interactive 3D and GLB browser smoke test
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/forge-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node pipeline/tests/browser-smoke.mjs
      - name: Install Blender batch runtime
        run: |
          # Refresh runner package indexes before installing: ubuntu archive mirrors can
          # otherwise return 404 for package versions that have already been rotated.
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 blender python3-numpy
          blender --version
      - name: Generate and validate Phase 4 synthetic reference assets
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          mkdir -p artifacts/phase4-reference
          blender --background --python pipeline/blender/generate_phase4_reference_assets.py -- artifacts/phase4-reference
          python pipeline/scripts/validate_glb.py --require-rig artifacts/phase4-reference/body.glb
          python pipeline/scripts/validate_glb.py --require-rig artifacts/phase4-reference/garment.glb
          blender --background --python pipeline/blender/rig_deformation_qa.py -- artifacts/phase4-reference/body.glb artifacts/phase4-reference/body-deformation-qa.json
          blender --background --python pipeline/blender/rig_deformation_qa.py -- artifacts/phase4-reference/garment.glb artifacts/phase4-reference/garment-deformation-qa.json
          python -m json.tool artifacts/phase4-reference/body-deformation-qa.json >/dev/null
          python -m json.tool artifacts/phase4-reference/garment-deformation-qa.json >/dev/null
          python - <<'PY'
          import json
          for name in ("body", "garment"):
              with open(f"artifacts/phase4-reference/{name}-deformation-qa.json", encoding="utf-8") as f:
                  qa = json.load(f)
              assert qa["status"] == "pass", (name, qa.get("issues"))
              assert qa["bone_count"] >= 20, (name, qa["bone_count"])
              assert qa["artist_review_required"] is True
              assert qa["engine_certified"] is False
          print("Reference rig skinning and sampled deformation QA passed; production approval remains blocked.")
          PY
          python - <<'PY'
          import json
          p = "artifacts/phase4-reference/reference-asset-report.json"
          with open(p, encoding="utf-8") as f:
              report = json.load(f)
          assert report["is_synthetic_fixture"] is True
          assert report["production_release_approved"] is False
          assert report["certification_status"] == "synthetic_reference_only"
          assert report["mesh_validation"]["animation_test_action"] == "Forge_Reference_Deformation_Test"
          assert report["mesh_validation"]["production_animation_clips"] == []
          assert report["mesh_validation"]["garment_pin_group"] is True
          assert report["mesh_validation"]["garment_tear_seam_group"] is True
          print("Synthetic reference asset generation verified; production certification remains blocked.")
          PY
      - name: Verify Phase 3 retopology and high-to-low baking
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          mkdir -p artifacts/phase3-mesh
          blender --background --python pipeline/tests/blender_phase3_mesh_fixtures.py -- artifacts/phase3-mesh
          blender --background --python pipeline/blender/retopologize.py -- artifacts/phase3-mesh/high.glb artifacts/phase3-mesh/retopo.glb 300
          python pipeline/scripts/validate_glb.py artifacts/phase3-mesh/retopo.glb
          python pipeline/scripts/validate_phase3_mesh_reports.py --retopo artifacts/phase3-mesh/retopo.glb.retopo.json
          blender --background --python pipeline/blender/retopo_quality_qa.py -- artifacts/phase3-mesh/retopo.glb artifacts/phase3-mesh/retopo-quality.json
          python -m json.tool artifacts/phase3-mesh/retopo-quality.json >/dev/null
          blender --background --python pipeline/blender/bake_pbr_textures.py -- artifacts/phase3-mesh/high.glb artifacts/phase3-mesh/low.glb artifacts/phase3-mesh/baked 256
          python pipeline/scripts/validate_phase3_mesh_reports.py --bake artifacts/phase3-mesh/baked/bake-report.json --min-resolution 256
          python -m json.tool artifacts/phase3-mesh/retopo.glb.retopo.json >/dev/null
          python -m json.tool artifacts/phase3-mesh/baked/bake-report.json >/dev/null
      - name: Generate and validate sample production jobs
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --python pipeline/blender/generate_pbr_textures.py -- artifacts/pbr/starter 512
          python pipeline/scripts/validate_pbr_materials.py pipeline/manifests/starter-pbr-materials.json
          python -m json.tool artifacts/pbr/starter/pbr-texture-report.json >/dev/null
          mkdir -p artifacts/phase2-tests
          blender --background --python pipeline/tests/blender_phase2_fixtures.py -- artifacts/phase2-tests
          blender --background --python pipeline/blender/phase2_character.py -- artifacts/phase2-tests/body.glb pipeline/manifests/phase2-integration-job.json artifacts/phase2-tests/phase2-character.glb
          python pipeline/scripts/validate_glb.py --require-morphs artifacts/phase2-tests/phase2-character.glb
          python pipeline/scripts/validate_phase2_report.py artifacts/phase2-tests/phase2-character.glb.phase2.json
          blender --background --python pipeline/blender/validate_morph_deformation.py -- artifacts/phase2-tests/phase2-character.glb artifacts/phase2-tests/morph-qa.json
          python -m json.tool artifacts/phase2-tests/morph-qa.json >/dev/null
          blender --background --python pipeline/blender/fit_garment.py -- artifacts/phase2-tests/body.glb artifacts/phase2-tests/garment.glb artifacts/phase2-tests/fitted.glb artifacts/phase2-tests/fit-report.json
          python pipeline/scripts/validate_glb.py artifacts/phase2-tests/fitted.glb
          python -m json.tool artifacts/phase2-tests/fit-report.json >/dev/null
          blender --background --python pipeline/blender/qa_garment_fit.py -- artifacts/phase2-tests/fitted.glb artifacts/phase2-tests/fit-report.json artifacts/phase2-tests/garment-qa.json
          python pipeline/tests/validate_garment_qa.py artifacts/phase2-tests/garment-qa.json
          python -m json.tool artifacts/phase2-tests/garment-qa.json >/dev/null
          blender --background --python pipeline/blender/garment_collision_qa.py -- artifacts/phase2-tests/fitted.glb artifacts/phase2-tests/fit-report.json artifacts/phase2-tests/garment-collision-qa.json
          python -m json.tool artifacts/phase2-tests/garment-collision-qa.json >/dev/null
      - name: Test Phase 4 real-asset intake gate
        run: |
          python -m py_compile pipeline/blender/inspect_phase4_assets.py pipeline/scripts/validate_phase4_intake_report.py
          python pipeline/tests/test_phase4_intake.py
      - name: Test Phase 4 production release gate
        run: |
          python -m py_compile pipeline/scripts/validate_phase4_release.py
          python pipeline/tests/test_phase4_release.py
      - name: Bake and validate cloth simulation
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --python pipeline/tests/blender_triangle_intersection_tests.py
          mkdir -p artifacts/phase4-pose
          # Independently test the authored seam-split tear workflow on a compact mesh.
          blender --background --python pipeline/tests/blender_authored_tear_fixture.py -- artifacts/phase4-pose/tear-fixture.blend
          blender --background artifacts/phase4-pose/tear-fixture.blend --python pipeline/blender/authored_cloth_tear.py -- artifacts/phase4-pose/tear-fixture-torn.blend artifacts/phase4-pose/tear-fixture-report.json
          python pipeline/scripts/validate_authored_tear_report.py artifacts/phase4-pose/tear-fixture-report.json
          # Build the four-action garment fixture, author its seam tear, then validate poses and baked caches.
          blender --background --python pipeline/tests/blender_pose_suite_fixture.py -- artifacts/phase4-pose/pose-suite.blend
          blender --background artifacts/phase4-pose/pose-suite.blend --python pipeline/blender/authored_cloth_tear.py -- artifacts/phase4-pose/pose-suite-torn.blend artifacts/phase4-pose/pose-tear-report.json
          python pipeline/scripts/validate_authored_tear_report.py artifacts/phase4-pose/pose-tear-report.json
          blender --background artifacts/phase4-pose/pose-suite-torn.blend --python pipeline/blender/pose_cloth_qa.py -- artifacts/phase4-pose/pose-cloth-qa.json --require-clean
          python -m json.tool artifacts/phase4-pose/pose-cloth-qa.json >/dev/null
          for clip in Forge_Walk Forge_Run Forge_Jump Forge_Combat; do
            blender --background artifacts/phase4-pose/pose-suite-torn.blend --python pipeline/blender/bake_cloth_cache.py -- "artifacts/phase4-pose/cloth-bake-$clip.json" 1 "$clip" "artifacts/phase4-pose/cloth-$clip.blend"
            python -m json.tool "artifacts/phase4-pose/cloth-bake-$clip.json" >/dev/null
            blender --background "artifacts/phase4-pose/cloth-$clip.blend" --python pipeline/blender/cloth_integrity_qa.py -- "artifacts/phase4-pose/cloth-integrity-$clip.json" 1
            python pipeline/scripts/validate_cloth_integrity_report.py "artifacts/phase4-pose/cloth-integrity-$clip.json" --require-clean
          done
          blender --background --python pipeline/blender/prepare_cloth_scene.py -- artifacts/phase2-tests/fitted.glb artifacts/phase2-tests/cloth-sim.blend artifacts/phase2-tests/cloth-scene-report.json 60
          python -m json.tool artifacts/phase2-tests/cloth-scene-report.json >/dev/null
          blender --background artifacts/phase2-tests/cloth-sim.blend --python pipeline/blender/bake_cloth_cache.py -- artifacts/phase2-tests/cloth-bake-report.json 1
          python -m json.tool artifacts/phase2-tests/cloth-bake-report.json >/dev/null
          set +e
          blender --background artifacts/phase2-tests/cloth-sim.blend --python pipeline/blender/cloth_integrity_qa.py -- artifacts/phase2-tests/cloth-integrity-report.json 1
          CLOTH_QA_EXIT=$?
          set -e
          test -s artifacts/phase2-tests/cloth-integrity-report.json
          python -m json.tool artifacts/phase2-tests/cloth-integrity-report.json >/dev/null
          python pipeline/scripts/validate_cloth_integrity_report.py artifacts/phase2-tests/cloth-integrity-report.json --require-geometric-clean
          echo "Cloth QA exit code: $CLOTH_QA_EXIT (candidate findings are retained as an artifact; inspect before promotion)"
      - name: Validate rigging, facial animation and LOD outputs
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --python pipeline/blender/merge_meshes.py -- artifacts/phase2-tests/merge-input.glb artifacts/phase2-tests/merged.glb artifacts/phase2-tests/merge-report.json
          python pipeline/scripts/validate_glb.py artifacts/phase2-tests/merged.glb
          python -m json.tool artifacts/phase2-tests/merge-report.json >/dev/null
          for profile in humanoid_v1 mechanical_v1 quadruped_v1 avian_v1; do
            blender --background --python pipeline/blender/rig_character.py -- artifacts/phase2-tests/body.glb artifacts/phase2-tests/rig-$profile.glb "$profile"
            python pipeline/scripts/validate_glb.py --require-rig artifacts/phase2-tests/rig-$profile.glb
            blender --background --python pipeline/blender/rig_deformation_qa.py -- artifacts/phase2-tests/rig-$profile.glb artifacts/phase2-tests/rig-$profile-deformation-qa.json
            python -m json.tool artifacts/phase2-tests/rig-$profile-deformation-qa.json >/dev/null
          done
          python pipeline/tests/validate_phase2_reports.py artifacts/phase2-tests
          blender --background --python pipeline/blender/facial_morph_pack.py -- artifacts/phase2-tests/body.glb artifacts/phase2-tests/facial-pack.glb artifacts/phase2-tests/facial-pack-report.json
          python pipeline/scripts/validate_glb.py --require-morphs artifacts/phase2-tests/facial-pack.glb
          python -m json.tool artifacts/phase2-tests/facial-pack-report.json >/dev/null
          blender --background --python pipeline/blender/facial_animation_clips.py -- artifacts/phase2-tests/facial-pack.glb artifacts/phase2-tests/facial-animated.glb artifacts/phase2-tests/facial-animation-report.json
          python pipeline/scripts/validate_glb.py --require-morphs artifacts/phase2-tests/facial-animated.glb
          python -m json.tool artifacts/phase2-tests/facial-animation-report.json >/dev/null
          blender --background --python pipeline/blender/facial_lipsync.py -- artifacts/phase2-tests/facial-pack.glb pipeline/manifests/sample-lipsync-timeline.json artifacts/phase2-tests/facial-lipsync.glb artifacts/phase2-tests/facial-lipsync-report.json
          python pipeline/scripts/validate_glb.py --require-morphs artifacts/phase2-tests/facial-lipsync.glb
          python -m json.tool artifacts/phase2-tests/facial-lipsync-report.json >/dev/null
          blender --background --python pipeline/blender/generate_batch.py -- pipeline/manifests/sample-batch.json
          python pipeline/scripts/validate_glb.py artifacts/FG-HUM-000001.glb
          blender --background --python pipeline/blender/phase2_character.py -- artifacts/FG-HUM-000001.glb pipeline/manifests/sample-batch.json artifacts/FG-HUM-000001-phase2.glb
          python pipeline/scripts/validate_glb.py --require-morphs artifacts/FG-HUM-000001-phase2.glb
          python pipeline/scripts/validate_glb.py artifacts/FG-ROB-000001.glb
          mkdir -p artifacts/rigged
          blender --background --python pipeline/blender/rig_character.py -- artifacts/FG-ROB-000001.glb artifacts/rigged/FG-ROB-000001-mechanical.glb mechanical_v1
          python pipeline/scripts/validate_glb.py --require-rig artifacts/rigged/FG-ROB-000001-mechanical.glb
          blender --background --python pipeline/blender/rig_character.py -- artifacts/FG-ROB-000001.glb artifacts/rigged/FG-ROB-000001-quadruped.glb quadruped_v1
          python pipeline/scripts/validate_glb.py --require-rig artifacts/rigged/FG-ROB-000001-quadruped.glb
          blender --background --python pipeline/blender/rig_character.py -- artifacts/FG-ROB-000001.glb artifacts/rigged/FG-ROB-000001-avian.glb avian_v1
          python pipeline/scripts/validate_glb.py --require-rig artifacts/rigged/FG-ROB-000001-avian.glb
          blender --background --python pipeline/blender/rig_character.py -- artifacts/FG-HUM-000001-phase2.glb artifacts/rigged/FG-HUM-000001-rigged.glb
          python pipeline/scripts/validate_glb.py --require-rig --require-morphs artifacts/rigged/FG-HUM-000001-rigged.glb
          blender --background --python pipeline/blender/advanced_rig_controls.py -- artifacts/rigged/FG-HUM-000001-rigged.glb artifacts/rigged/FG-HUM-000001-advanced.glb artifacts/rigged/FG-HUM-000001-advanced-rig.json
          python pipeline/scripts/validate_glb.py --require-rig artifacts/rigged/FG-HUM-000001-advanced.glb
          python -m json.tool artifacts/rigged/FG-HUM-000001-advanced-rig.json >/dev/null
          blender --background --python pipeline/blender/animation_library.py -- artifacts/rigged/FG-HUM-000001-advanced.glb artifacts/rigged/FG-HUM-000001-animation-library.glb artifacts/rigged/FG-HUM-000001-animation-library.json
          python pipeline/scripts/validate_glb.py --require-rig artifacts/rigged/FG-HUM-000001-animation-library.glb
          python -m json.tool artifacts/rigged/FG-HUM-000001-animation-library.json >/dev/null
          blender --background --python pipeline/blender/qa_character.py -- artifacts/rigged/FG-HUM-000001-rigged.glb artifacts/rigged/FG-HUM-000001-qa.json
          python -m json.tool artifacts/rigged/FG-HUM-000001-qa.json >/dev/null
          blender --background --python pipeline/blender/build_lods.py -- artifacts/rigged/FG-HUM-000001-rigged.glb artifacts/lods
          python pipeline/scripts/validate_glb.py artifacts/lods/LOD0.glb
          python pipeline/scripts/validate_glb.py artifacts/lods/LOD1.glb
          python pipeline/scripts/validate_glb.py artifacts/lods/LOD2.glb
          python -m json.tool artifacts/lods/lod-report.json >/dev/null
          python pipeline/scripts/validate_engine_budget.py artifacts/lods/LOD0.glb pipeline/budgets/stylized-character-prototype.json
          python pipeline/scripts/validate_engine_budget.py artifacts/lods/LOD1.glb pipeline/budgets/stylized-character-prototype.json
          python pipeline/scripts/validate_engine_budget.py artifacts/lods/LOD2.glb pipeline/budgets/stylized-character-prototype.json
      - name: Generate and validate original stylized humanoid candidate
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          mkdir -p artifacts/stylized
          blender --background --python pipeline/blender/generate_stylized_character.py -- artifacts/stylized FG-HUM-STYLIZED-000001 100001
          python pipeline/scripts/validate_glb.py --require-rig artifacts/stylized/FG-HUM-STYLIZED-000001.glb
          python pipeline/scripts/validate_stylized_character.py artifacts/stylized/FG-HUM-STYLIZED-000001-report.json
          blender --background --python pipeline/blender/rig_deformation_qa.py -- artifacts/stylized/FG-HUM-STYLIZED-000001.glb artifacts/stylized/deformation-qa.json
          python -m json.tool artifacts/stylized/deformation-qa.json >/dev/null
          python - <<'PY'
          import json
          p="artifacts/stylized/deformation-qa.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["status"]=="pass", d.get("issues")
          assert d["bone_count"]>=40
          assert d["artist_review_required"] is True and d["engine_certified"] is False
          print("Stylized candidate skinning and sampled deformation checks passed.")
          PY
          blender --background --python pipeline/blender/advanced_rig_controls.py -- artifacts/stylized/FG-HUM-STYLIZED-000001.glb artifacts/stylized/advanced-rig.glb artifacts/stylized/advanced-rig.json
          python pipeline/scripts/validate_glb.py --require-rig artifacts/stylized/advanced-rig.glb
          python -m json.tool artifacts/stylized/advanced-rig.json >/dev/null
          blender --background --python pipeline/blender/facial_morph_pack.py -- artifacts/stylized/advanced-rig.glb artifacts/stylized/facial-morphs.glb artifacts/stylized/facial-morphs.json
          python pipeline/scripts/validate_glb.py --require-morphs artifacts/stylized/facial-morphs.glb
          python -m json.tool artifacts/stylized/facial-morphs.json >/dev/null
          blender --background --python pipeline/blender/facial_lipsync.py -- artifacts/stylized/facial-morphs.glb pipeline/manifests/sample-lipsync-timeline.json artifacts/stylized/lipsync.glb artifacts/stylized/lipsync.json
          python pipeline/scripts/validate_glb.py --require-morphs artifacts/stylized/lipsync.glb
          python -m json.tool artifacts/stylized/lipsync.json >/dev/null
          blender --background --python pipeline/blender/animation_library.py -- artifacts/stylized/advanced-rig.glb artifacts/stylized/animation-library.glb artifacts/stylized/animation-library.json
          python pipeline/scripts/validate_glb.py --require-rig artifacts/stylized/animation-library.glb
          python -m json.tool artifacts/stylized/animation-library.json >/dev/null

      - name: Upload verified GLB and QA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forge-100k-pipeline-artifacts
          path: |
            artifacts/**/*.glb
            artifacts/**/*.json
            artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 14
