name: Pipeline quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-pipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON manifests and schema
        run: |
          python -m pip install jsonschema==4.25.1
          python -m json.tool pipeline/manifests/sample-batch.json >/dev/null
          python -m json.tool pipeline/schemas/asset-job.schema.json >/dev/null
          python -m json.tool pipeline/schemas/batch-manifest.schema.json >/dev/null
          python -m json.tool pipeline/schemas/pbr-material.schema.json >/dev/null
          python -m py_compile pipeline/blender/generate_pbr_textures.py
          python pipeline/scripts/validate_manifest.py pipeline/manifests/sample-batch.json
      - name: Compile Python workers
        run: |
          python -m compileall -q pipeline
          python -m py_compile pipeline/blender/fit_garment.py pipeline/blender/merge_meshes.py
      - name: Run GLB validator tests
        run: |
          python pipeline/tests/test_glb_validator.py
          python pipeline/tests/test_morphology.py
          python pipeline/tests/test_engine_budget.py
          python pipeline/tests/test_pbr_materials.py
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run interactive 3D and GLB browser smoke test
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/forge-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node pipeline/tests/browser-smoke.mjs
      - name: Install Blender batch runtime
        run: |
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Generate and validate sample production jobs
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --python pipeline/blender/generate_pbr_textures.py -- artifacts/pbr/starter 512
          python pipeline/scripts/validate_pbr_materials.py pipeline/manifests/starter-pbr-materials.json
          python -m json.tool artifacts/pbr/starter/pbr-texture-report.json >/dev/null
          mkdir -p artifacts/phase2-tests
          blender --background --python pipeline/tests/blender_phase2_fixtures.py -- artifacts/phase2-tests
          blender --background --python pipeline/blender/fit_garment.py -- artifacts/phase2-tests/body.glb artifacts/phase2-tests/garment.glb artifacts/phase2-tests/fitted.glb artifacts/phase2-tests/fit-report.json
          python pipeline/scripts/validate_glb.py artifacts/phase2-tests/fitted.glb
          python -m json.tool artifacts/phase2-tests/fit-report.json >/dev/null
          blender --background --python pipeline/blender/merge_meshes.py -- artifacts/phase2-tests/merge-input.glb artifacts/phase2-tests/merged.glb artifacts/phase2-tests/merge-report.json
          python pipeline/scripts/validate_glb.py artifacts/phase2-tests/merged.glb
          python -m json.tool artifacts/phase2-tests/merge-report.json >/dev/null
          for profile in humanoid_v1 mechanical_v1 quadruped_v1 avian_v1; do
            blender --background --python pipeline/blender/rig_character.py -- artifacts/phase2-tests/body.glb artifacts/phase2-tests/rig-$profile.glb "$profile"
            python pipeline/scripts/validate_glb.py --require-rig artifacts/phase2-tests/rig-$profile.glb
          done
          python pipeline/tests/validate_phase2_reports.py artifacts/phase2-tests
          blender --background --python pipeline/blender/generate_batch.py -- pipeline/manifests/sample-batch.json
          python pipeline/scripts/validate_glb.py artifacts/FG-HUM-000001.glb
          blender --background --python pipeline/blender/phase2_character.py -- artifacts/FG-HUM-000001.glb pipeline/manifests/sample-batch.json artifacts/FG-HUM-000001-phase2.glb
          python pipeline/scripts/validate_glb.py --require-morphs artifacts/FG-HUM-000001-phase2.glb
          python pipeline/scripts/validate_glb.py artifacts/FG-ROB-000001.glb
          mkdir -p artifacts/rigged
          blender --background --python pipeline/blender/rig_character.py -- artifacts/FG-ROB-000001.glb artifacts/rigged/FG-ROB-000001-mechanical.glb mechanical_v1
          python pipeline/scripts/validate_glb.py --require-rig artifacts/rigged/FG-ROB-000001-mechanical.glb
          blender --background --python pipeline/blender/rig_character.py -- artifacts/FG-ROB-000001.glb artifacts/rigged/FG-ROB-000001-quadruped.glb quadruped_v1
          python pipeline/scripts/validate_glb.py --require-rig artifacts/rigged/FG-ROB-000001-quadruped.glb
          blender --background --python pipeline/blender/rig_character.py -- artifacts/FG-ROB-000001.glb artifacts/rigged/FG-ROB-000001-avian.glb avian_v1
          python pipeline/scripts/validate_glb.py --require-rig artifacts/rigged/FG-ROB-000001-avian.glb
          blender --background --python pipeline/blender/rig_character.py -- artifacts/FG-HUM-000001-phase2.glb artifacts/rigged/FG-HUM-000001-rigged.glb
          python pipeline/scripts/validate_glb.py --require-rig --require-morphs artifacts/rigged/FG-HUM-000001-rigged.glb
          blender --background --python pipeline/blender/qa_character.py -- artifacts/rigged/FG-HUM-000001-rigged.glb artifacts/rigged/FG-HUM-000001-qa.json
          python -m json.tool artifacts/rigged/FG-HUM-000001-qa.json >/dev/null
          blender --background --python pipeline/blender/build_lods.py -- artifacts/rigged/FG-HUM-000001-rigged.glb artifacts/lods
          python pipeline/scripts/validate_glb.py artifacts/lods/LOD0.glb
          python pipeline/scripts/validate_glb.py artifacts/lods/LOD1.glb
          python pipeline/scripts/validate_glb.py artifacts/lods/LOD2.glb
          python -m json.tool artifacts/lods/lod-report.json >/dev/null
          python pipeline/scripts/validate_engine_budget.py artifacts/lods/LOD0.glb pipeline/budgets/stylized-character-prototype.json
          python pipeline/scripts/validate_engine_budget.py artifacts/lods/LOD1.glb pipeline/budgets/stylized-character-prototype.json
          python pipeline/scripts/validate_engine_budget.py artifacts/lods/LOD2.glb pipeline/budgets/stylized-character-prototype.json
      - name: Upload verified GLB and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-phase1-character-build
          path: |
            artifacts/**/*.glb
            artifacts/**/*.json
            artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 14
