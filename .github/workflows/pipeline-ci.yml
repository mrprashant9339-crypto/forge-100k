name: Pipeline quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON manifests and schema
        run: |
          python -m json.tool pipeline/manifests/sample-batch.json >/dev/null
          python -m json.tool pipeline/schemas/asset-job.schema.json >/dev/null
      - name: Compile Python workers
        run: python -m compileall -q pipeline
      - name: Run GLB validator tests
        run: python pipeline/tests/test_glb_validator.py
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run interactive 3D and GLB browser smoke test
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/forge-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node pipeline/tests/browser-smoke.mjs
      - name: Install Blender batch runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Generate and validate sample production jobs
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender --background --python pipeline/blender/generate_batch.py -- pipeline/manifests/sample-batch.json
          python pipeline/scripts/validate_glb.py artifacts/FG-HUM-000001.glb
          python pipeline/scripts/validate_glb.py artifacts/FG-ROB-000001.glb
          mkdir -p artifacts/rigged
          blender --background --python pipeline/blender/rig_character.py -- artifacts/FG-HUM-000001.glb artifacts/rigged/FG-HUM-000001-rigged.glb
          python pipeline/scripts/validate_glb.py --require-rig artifacts/rigged/FG-HUM-000001-rigged.glb
          blender --background --python pipeline/blender/qa_character.py -- artifacts/rigged/FG-HUM-000001-rigged.glb artifacts/rigged/FG-HUM-000001-qa.json
          python -m json.tool artifacts/rigged/FG-HUM-000001-qa.json >/dev/null
      - name: Upload verified GLB and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-phase1-character-build
          path: |
            artifacts/**/*.glb
            artifacts/**/*.json
          if-no-files-found: warn
          retention-days: 14
